version: "1.0"

services:

  postgres:
    image: postgres:17-alpine
    container_name: quality-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quality_tracker

    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./quality_tracker.sql:/docker-entrypoint-initdb.d/quality_tracker.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quality_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    container_name: quality-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: quality_tracker

    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod

    container_name: quality-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

volumes:
  postgres_data: